name: Verify center and agent
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Verify dependency checksums independently
        run: |
          tmp=$(mktemp -d)
          cp go.mod "$tmp/"
          (cd "$tmp" && GOMODCACHE="$tmp/cache" go mod download all)
          diff -u go.sum "$tmp/go.sum"
          go mod verify
      - run: go vet ./...
      - run: go test -race ./...
        env:
          PTO_CHROME: /usr/bin/google-chrome
      - run: python3 -B tests/test_pilot_adapters.py
      - run: node --check internal/center/app.js
      - run: node --check internal/center/topology.js
      - run: node --check internal/center/fleet-views.js
      - run: node --check internal/center/workflows.js
      - run: make build
